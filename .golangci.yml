version: "2"
linters:
  disable:
    - funlen
  settings:
    errcheck:
      check-type-assertions: true
      # HTTP JSON responses: Encode failure after/before a written status has
      # nothing to recover; the codebase consistently ignores it (40+ existing
      # //nolint:errcheck on exactly this call). Excluded at config level so
      # new handlers don't need the per-line comment.
      exclude-functions:
        - (*encoding/json.Encoder).Encode
    # govet shadow deliberately NOT enabled: 37 findings at adoption, all
    # the idiomatic `if _, err := ...` pattern (25 in tests) — advisory
    # style-check with no defect found; re-evaluate after v0.1.0.
    govet:
      enable:
        - nilness
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
