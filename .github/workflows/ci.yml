name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  REGISTRY: ghcr.io
  SERVER_IMAGE: ghcr.io/${{ github.repository }}/server
  DASHBOARD_IMAGE: ghcr.io/${{ github.repository }}/dashboard

jobs:
  test-server:
    runs-on: ubuntu-latest
    services:
      # Integration tests apply all embedded migrations per test schema and
      # self-skip when DATABASE_URL is unset — this service is what makes
      # them actually run instead of silently skipping (report §5).
      # Single instance on 15432: the dynsecret sweeper test uses the SAME
      # instance as the dynamic-role backend ("same instance, same pg_roles"
      # per sweep_integration_test.go), so DATABASE_URL must point here.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: server/go.sum

      - name: Go vet
        run: cd server && go vet ./...

      - name: Go build
        run: cd server && go build ./...

      - name: Go unit + integration tests
        env:
          DATABASE_URL: postgres://postgres@localhost:15432/postgres?sslmode=disable
        run: cd server && go test ./internal/... ./pkg/... -count=1 -timeout 10m

  test-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mcp-server

      - name: Rust tests
        run: cd mcp-server && cargo test --locked

  test-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install deps
        run: cd dashboard && npm ci

      - name: Type check
        run: cd dashboard && npx tsc --noEmit

      - name: Unit tests
        run: cd dashboard && npm test -- --run

      - name: Build
        run: cd dashboard && npm run build

  test-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: valt-cli/go.sum

      - name: Build CLI
        run: cd valt-cli && go build ./...

      - name: CLI vet
        run: cd valt-cli && go vet ./...

  lint-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: server/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          working-directory: server

  # Release gate: boots the real server against Postgres and walks the
  # ask-first happy path over HTTP (health → register → login → secret →
  # auto-approved request → credential → audit). Catches wiring regressions
  # (routing, middleware, policy resolution) that in-process tests cannot.
  e2e-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres@localhost:15432/postgres?sslmode=disable
      SMOKE_BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: server/go.sum

      - name: Generate JWT keys and master key
        run: |
          mkdir -p keys
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out keys/private.pem
          openssl rsa -in keys/private.pem -pubout -out keys/public.pem
          echo "VAULT_MASTER_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Apply migrations
        run: cd server && go run ./cmd/migrate up

      - name: Start server
        env:
          PORT: "8080"
          JWT_PRIVATE_KEY_PATH: ${{ github.workspace }}/keys/private.pem
          JWT_PUBLIC_KEY_PATH: ${{ github.workspace }}/keys/public.pem
          BASE_URL: http://localhost:8080
          DASHBOARD_URL: http://localhost:3000
          CORS_ORIGINS: http://localhost:3000
          VAULT_MASTER_KEY: ${{ env.VAULT_MASTER_KEY }}
        run: |
          cd server
          go build -o /tmp/valtag-server ./cmd/server
          nohup /tmp/valtag-server > /tmp/valtag-server.log 2>&1 &
          echo $! > /tmp/valtag-server.pid

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -sf "$SMOKE_BASE_URL/health" > /dev/null; then
              echo "server healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "server did not become healthy"; tail -50 /tmp/valtag-server.log; exit 1

      - name: Run API smoke flow
        run: cd server && go test -tags=smoke ./tests/smoke/ -v -count=1 -timeout 3m

      - name: Server log on failure
        if: failure()
        run: tail -100 /tmp/valtag-server.log

  build-and-push:
    runs-on: ubuntu-latest
    needs: [test-server, test-dashboard, test-cli, test-mcp, lint-server, e2e-smoke]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push server image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: |
            ${{ env.SERVER_IMAGE }}:latest
            ${{ env.SERVER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push dashboard image
        uses: docker/build-push-action@v5
        with:
          context: ./dashboard
          push: true
          tags: |
            ${{ env.DASHBOARD_IMAGE }}:latest
            ${{ env.DASHBOARD_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    # Opt-in: the repo transfer to ldphuong-vn dropped the VPS_* Actions
    # secrets (secrets do not transfer with repositories), so this job went
    # red on every push. Set the repository variable DEPLOY_ENABLED=true
    # AND re-add secrets (VPS_HOST, VPS_USER, VPS_SSH_KEY) to deploy again.
    if: github.ref == 'refs/heads/master' && github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/valtag

            # Pull latest images from GHCR
            docker compose -f docker-compose.prod.yml pull server dashboard migrate

            # Zero-downtime restart
            docker compose -f docker-compose.prod.yml up -d server dashboard

            # Prune old images
            docker image prune -f

            # Verify health
            sleep 10
            curl -sf http://localhost/health || echo "Health check failed"

      - name: Notify on failure
        if: failure()
        run: |
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
              -H 'Content-Type: application/json' \
              -d "{\"text\":\"Deploy failed for commit \`${{ github.sha }}\` by ${{ github.actor }}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
          fi

# Required GitHub Secrets:
#   VPS_HOST        - VPS IP address (e.g. 103.142.137.232)
#   VPS_USER        - SSH user on VPS (e.g. root)
#   VPS_SSH_KEY     - SSH private key contents for VPS access
#   SLACK_WEBHOOK_URL - (optional) Slack incoming webhook for deploy failure alerts
#
# GHCR auth uses GITHUB_TOKEN automatically (no extra secret needed).
# VPS must have docker + docker compose installed and /opt/valtag checked out.
# docker-compose.prod.yml on VPS must reference GHCR images (see deploy-manual.yml comments).
