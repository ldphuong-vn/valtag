services:
  # PostgreSQL database — also stores the encrypted secret blobs
  # (secret_blobs table); no separate object store needed.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-valtag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-valtag_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-valtag}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-valtag}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Go backend server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-valtag}:${POSTGRES_PASSWORD:-valtag_dev_password}@postgres:5432/${POSTGRES_DB:-valtag}?sslmode=disable
      CORS_ORIGINS: http://localhost:3000,http://localhost:8443
      JWT_PRIVATE_KEY_PATH: /app/keys/private.pem
      JWT_PUBLIC_KEY_PATH: /app/keys/public.pem
      VAULT_MASTER_KEY: ${VAULT_MASTER_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-http://localhost:8080/api/v1/auth/google/callback}
      DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:3000}
    volumes:
      - ./keys:/app/keys:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # Next.js dashboard
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8443
      BACKEND_URL: http://server:8080
    ports:
      - "3000:3000"
    depends_on:
      - server

  # Caddy reverse proxy
  caddy:
    image: caddy:2-alpine
    ports:
      - "8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - server
      - dashboard

volumes:
  pgdata:
  caddy-data:
  caddy-config:
