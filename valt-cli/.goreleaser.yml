version: 2

project_name: valtag

before:
  hooks:
    - go mod tidy

builds:
  - id: valtag
    # GoReleaser runs with workdir: valt-cli (see release-valt-cli.yml)
    dir: .
    main: .
    binary: valtag
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: valtag
    builds: [valtag]
    name_template: "valtag_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

release:
  # Repo owner/name inferred from the git remote (ldphuong-vn/valtag)

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
